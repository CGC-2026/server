name: Build, Migrate, & Deploy (prod)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
  LOG_GROUP_NAME: ${{ secrets.LOG_GROUP_NAME}}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash ./scripts/ci/build_and_push.sh
          
  migrate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run Migrations via SSM
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash ./scripts/ci/migrate_via_ssm.sh

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash ./scripts/ci/deploy_via_ssm.sh

      - name: Verify health
        run: bash ./scripts/ci/health_check.sh
          