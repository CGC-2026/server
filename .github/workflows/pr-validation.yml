name: PR Validation

on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  build-fast-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          go build -buildvcs=false -o bin/server ./cmd/server/main.go

      - name: Run fast tests
        run: make test

  integration-postgres:
    runs-on: ubuntu-latest
    needs: build-fast-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d server_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/server_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make test-integration
